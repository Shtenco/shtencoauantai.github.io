name: Synergy Shielded V5 Fast Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "bullish_cb_v2_ci/contracts/BullishQuickSwapShieldedV5.sol"
      - "bullish_cb_v2_ci/contracts/SynergyQuickSwapBootstrapV5.sol"
      - "bullish_cb_v2_ci/contracts/RebaseSynaExactV3.sol"
      - "bullish_cb_v2_ci/test/synergy_shielded_v5_polygon_fork.js"
      - "bullish_cb_v2_ci/hardhat.config.js"
      - ".github/workflows/synergy_shielded_v5_fast_gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: economics
            grep: "remains positive after complete constructor V5 setup"
          - id: refill
            grep: "passes protected robot refill"
    name: fast-v5-${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bullish_cb_v2_ci
    env:
      POLYGON_RPC_URL: https://polygon-bor-rpc.publicnode.com
      LOCAL_FORK_URL: http://127.0.0.1:8545
      FORK_BLOCK_NUMBER: "90790000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind immutable commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p reports/fast-v5-${{ matrix.id }}
          git rev-parse HEAD | tee reports/fast-v5-${{ matrix.id }}/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install and compile exact source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          rm -f contracts/BullishQuickSwapDirectV4.sol
          rm -rf artifacts cache
          npx hardhat compile --force 2>&1 | tee reports/fast-v5-${{ matrix.id }}/compile.log
          sha256sum \
            hardhat.config.js \
            contracts/RebaseSynaExactV3.sol \
            contracts/BullishQuickSwapRefillV2.sol \
            contracts/BullishQuickSwapShieldedV5.sol \
            contracts/SynergyQuickSwapBootstrapV5.sol \
            test/synergy_shielded_v5_polygon_fork.js \
            > reports/fast-v5-${{ matrix.id }}/source-sha256.txt
      - name: Start isolated Polygon fork
        run: |
          set -euo pipefail
          anvil \
            --fork-url "$POLYGON_RPC_URL" \
            --fork-block-number "$FORK_BLOCK_NUMBER" \
            --chain-id 137 \
            --hardfork cancun \
            --host 127.0.0.1 \
            --port 8545 \
            > reports/fast-v5-${{ matrix.id }}/anvil.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s "$LOCAL_FORK_URL" \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              | grep -q '0x89'; then exit 0; fi
            sleep 1
          done
          cat reports/fast-v5-${{ matrix.id }}/anvil.log
          exit 1
      - name: Execute ${{ matrix.id }} proof
        run: |
          set -euo pipefail
          npx hardhat test test/synergy_shielded_v5_polygon_fork.js \
            --network polygon --grep '${{ matrix.grep }}' \
            2>&1 | tee reports/fast-v5-${{ matrix.id }}/fork.log
      - name: Validate economics
        if: matrix.id == 'economics'
        run: |
          set -euo pipefail
          python - <<'PY' | tee reports/fast-v5-economics/validator.log
          import json
          from pathlib import Path
          r = json.loads(Path("reports/shielded-v5/first10.json").read_text())
          assert r["chainId"] == 137
          assert r["forkBlock"] == 90790000
          assert r["netGrowthAfterGasUsdt"] > 0
          assert r["verdict"] == "PASS_POSITIVE_SHIELDED_FIRST10"
          Path("reports/fast-v5-economics/first10.json").write_text(json.dumps(r, indent=2))
          print(json.dumps(r, indent=2))
          PY
      - name: Bind evidence
        run: |
          set -euo pipefail
          find reports/fast-v5-${{ matrix.id }} -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > reports/fast-v5-${{ matrix.id }}/evidence-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synergy-fast-v5-${{ matrix.id }}
          path: bullish_cb_v2_ci/reports/fast-v5-${{ matrix.id }}
          if-no-files-found: warn
