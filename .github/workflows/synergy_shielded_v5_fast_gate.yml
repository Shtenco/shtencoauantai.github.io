name: Synergy Shielded V5 Fast Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "bullish_cb_v2_ci/contracts/BullishQuickSwapShieldedV5.sol"
      - "bullish_cb_v2_ci/contracts/SynergyQuickSwapBootstrapV5.sol"
      - "bullish_cb_v2_ci/contracts/RebaseSynaExactV3.sol"
      - "bullish_cb_v2_ci/test/synergy_shielded_v5_polygon_fork.js"
      - "bullish_cb_v2_ci/tools/synergy_local_signer.mjs"
      - "bullish_cb_v2_ci/hardhat.config.js"
      - ".github/workflows/synergy_shielded_v5_fast_gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: economics
            grep: "remains positive after complete constructor V5 setup"
          - id: refill
            grep: "passes protected robot refill"
    name: fast-v5-${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bullish_cb_v2_ci
    env:
      POLYGON_RPC_URL: https://polygon-bor-rpc.publicnode.com
      LOCAL_FORK_URL: http://127.0.0.1:8545
      FORK_BLOCK_NUMBER: "90790000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind immutable commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p reports/fast-v5-${{ matrix.id }}
          git rev-parse HEAD | tee reports/fast-v5-${{ matrix.id }}/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install and compile exact source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          rm -f contracts/BullishQuickSwapDirectV4.sol
          rm -rf artifacts cache
          npx hardhat compile --force 2>&1 | tee reports/fast-v5-${{ matrix.id }}/compile.log
          sha256sum \
            hardhat.config.js \
            contracts/RebaseSynaExactV3.sol \
            contracts/BullishQuickSwapRefillV2.sol \
            contracts/BullishQuickSwapShieldedV5.sol \
            contracts/SynergyQuickSwapBootstrapV5.sol \
            test/synergy_shielded_v5_polygon_fork.js \
            > reports/fast-v5-${{ matrix.id }}/source-sha256.txt
      - name: Start isolated Polygon fork
        run: |
          set -euo pipefail
          anvil \
            --fork-url "$POLYGON_RPC_URL" \
            --fork-block-number "$FORK_BLOCK_NUMBER" \
            --chain-id 137 \
            --hardfork cancun \
            --host 127.0.0.1 \
            --port 8545 \
            > reports/fast-v5-${{ matrix.id }}/anvil.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s "$LOCAL_FORK_URL" \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              | grep -q '0x89'; then exit 0; fi
            sleep 1
          done
          cat reports/fast-v5-${{ matrix.id }}/anvil.log
          exit 1
      - name: Execute ${{ matrix.id }} proof
        run: |
          set -euo pipefail
          npx hardhat test test/synergy_shielded_v5_polygon_fork.js \
            --network polygon --grep '${{ matrix.grep }}' \
            2>&1 | tee reports/fast-v5-${{ matrix.id }}/fork.log
      - name: Validate economics
        if: matrix.id == 'economics'
        run: |
          set -euo pipefail
          python - <<'PY' | tee reports/fast-v5-economics/validator.log
          import json
          from pathlib import Path
          r = json.loads(Path("reports/shielded-v5/first10.json").read_text())
          assert r["chainId"] == 137
          assert r["forkBlock"] == 90790000
          assert r["netGrowthAfterGasUsdt"] > 0
          assert r["verdict"] == "PASS_POSITIVE_SHIELDED_FIRST10"
          Path("reports/fast-v5-economics/first10.json").write_text(json.dumps(r, indent=2))
          print(json.dumps(r, indent=2))
          PY
      - name: Bind evidence
        run: |
          set -euo pipefail
          find reports/fast-v5-${{ matrix.id }} -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > reports/fast-v5-${{ matrix.id }}/evidence-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synergy-fast-v5-${{ matrix.id }}
          path: bullish_cb_v2_ci/reports/fast-v5-${{ matrix.id }}
          if-no-files-found: warn

  local-deploy-bundle:
    name: local-deploy-bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bullish_cb_v2_ci
    env:
      POLYGON_RPC_URL: https://polygon-bor-rpc.publicnode.com
      DEPLOYER: 0x6946999DBCE63b140B1bB9D475F7c357130909E5
      ROUTER: 0xa5E0829CaCEd8fFDD4De3c43696c57F7D7A678ff
      FACTORY: 0x5757371414417b8C6CAad45bAeF941aBc7d3Ab32
      USDT: 0xc2132D05D31c914a87C6611C10748AEb04B58e8F
      WPOL: 0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile and bundle offline signer
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save esbuild
          rm -f contracts/BullishQuickSwapDirectV4.sol
          rm -rf artifacts cache bundle
          npx hardhat compile --force
          mkdir -p bundle
          cp artifacts/contracts/SynergyQuickSwapBootstrapV5.sol/SynergyQuickSwapBootstrapV5.json bundle/
          npx esbuild tools/synergy_local_signer.mjs --bundle --platform=node --format=cjs --outfile=bundle/synergy_local_signer.cjs
          node - <<'NODE' | tee bundle/bytecode-sizes.json
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('bundle/SynergyQuickSwapBootstrapV5.json'));
          const result = {
            initCodeBytes: (a.bytecode.length - 2) / 2,
            deployedCodeBytes: (a.deployedBytecode.length - 2) / 2,
          };
          result.withinEip3860InitCodeLimit = result.initCodeBytes <= 49152;
          console.log(JSON.stringify(result, null, 2));
          if (!result.withinEip3860InitCodeLimit) process.exit(2);
          NODE
      - name: Query live Polygon state
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { Contract, JsonRpcProvider, getAddress } from 'ethers';
          const provider = new JsonRpcProvider(process.env.POLYGON_RPC_URL, 137, { staticNetwork: true });
          const deployer = getAddress(process.env.DEPLOYER);
          const routerAddress = getAddress(process.env.ROUTER);
          const factoryAddress = getAddress(process.env.FACTORY);
          const usdtAddress = getAddress(process.env.USDT);
          const wpolAddress = getAddress(process.env.WPOL);
          const network = await provider.getNetwork();
          const block = await provider.getBlock('latest');
          const [nonceLatest, noncePending, polBalance, feeData] = await Promise.all([
            provider.getTransactionCount(deployer, 'latest'),
            provider.getTransactionCount(deployer, 'pending'),
            provider.getBalance(deployer),
            provider.getFeeData(),
          ]);
          const usdt = new Contract(usdtAddress, ['function balanceOf(address) view returns(uint256)'], provider);
          const router = new Contract(routerAddress, ['function factory() view returns(address)', 'function WETH() view returns(address)'], provider);
          const [usdtBalance, routerFactory, routerWeth] = await Promise.all([usdt.balanceOf(deployer), router.factory(), router.WETH()]);
          const gasPrice = feeData.gasPrice ?? feeData.maxFeePerGas;
          if (!block || !gasPrice) throw new Error('Missing live block or gas price');
          const result = {
            chainId: Number(network.chainId),
            blockNumber: block.number,
            blockTimestamp: block.timestamp,
            blockGasLimit: block.gasLimit.toString(),
            gasPriceWei: gasPrice.toString(),
            deployer,
            nonceLatest: nonceLatest.toString(),
            noncePending: noncePending.toString(),
            polBalanceWei: polBalance.toString(),
            usdt: usdtAddress,
            usdtBalanceRaw: usdtBalance.toString(),
            router: routerAddress,
            factory: factoryAddress,
            wpol: wpolAddress,
            routerFactory: getAddress(routerFactory),
            routerWeth: getAddress(routerWeth),
          };
          if (result.chainId !== 137 || result.routerFactory !== factoryAddress || result.routerWeth !== wpolAddress) throw new Error('Polygon or QuickSwap binding mismatch');
          fs.writeFileSync('bundle/preflight.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
          sha256sum bundle/* > bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: synergy-v5-local-deploy-bundle
          path: bullish_cb_v2_ci/bundle
          if-no-files-found: error
          compression-level: 6
